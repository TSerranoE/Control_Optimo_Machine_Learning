[project]
name = "control-optimo-machine-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupytext>=1.19.4",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pytest>=9.1.1",
    "scipy>=1.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["tarea1", "tarea1/src", "tarea2", "tarea2/src"]
testpaths = ["tarea1/tests", "tarea2/tests"]
addopts = "-ra -q"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.jupytext]
formats = [
    "tarea1/notebooks///ipynb",
    "tarea1/notebooks///py:percent",
    "tarea2/notebooks///ipynb",
    "tarea2/notebooks///py:percent",
]
notebook_metadata_filter = "all"
cell_metadata_filter = "all"

[tool.coverage.run]
source = ["tarea1/src", "tarea1/utils", "tarea2/src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
